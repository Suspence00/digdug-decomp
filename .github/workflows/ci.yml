name: Test native port

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux window dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbcommon-dev libxi-dev libxcursor-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Run tests with synthetic data (no arcade ROMs)
        run: cargo test --locked --all-targets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check recorded-input importer with synthetic data
        run: python -m unittest discover -s tools/mame -p test_import_wolf170.py -v
